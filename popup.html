<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyra - Mini Player</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <div class="header">
      <h1 class="title">Lyra</h1>
      <p class="subtitle">Picture-in-Picture Mini Player for YouTube Music</p>
    </div>

    <!-- Steps Section -->
    <div class="section">
      <div class="section-label">HOW TO USE</div>
      <div class="steps">
        <div class="step-item">
          <span class="step-num">1</span>
          <div class="step-content">
            Open <a href="https://music.youtube.com" target="_blank" class="yt-link">YouTube Music ↗</a>
          </div>
        </div>
        <div class="step-item">
          <span class="step-num">2</span>
          <div class="step-content">Play any track or playlist</div>
        </div>
        <div class="step-item">
          <span class="step-num">3</span>
          <div class="step-content">Switch tab to pop out Mini Player</div>
        </div>
      </div>
    </div>

    <!-- Tip Section -->
    <div class="tip-box">
      <div class="tip-header">
        <span class="tip-tag">PRO TIP</span>
        <span class="tip-text">For seamless playback without ad interruptions:</span>
      </div>
      <a href="https://chromewebstore.google.com/detail/adblock-%E2%80%94-block-ads-acros/gighmmpiobklfepjocnamgkkbiglidom?hl=en" target="_blank" class="adblock-link">
        Get AdBlock Extension ↗
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
