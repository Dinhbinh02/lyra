<div id="mini-player-root">
  <div id="ambient-bg" class="ambient-bg">
    <img id="bg-cover" class="bg-layer bg-base" src="" alt="bg" />
    <img class="bg-layer bg-center" src="" alt="bg" />
    <img class="bg-layer bg-left" src="" alt="bg" />
    <img class="bg-layer bg-right" src="" alt="bg" />
    <div class="ambient-overlay"></div>
  </div>

  <div class="player-container">
    <div class="top-section">
      <div class="cover-wrapper">
        <div class="cover">
          <img id="cover" src="" alt="cover" class="hide" />
          <div id="noCover" class="cover-placeholder"></div>
          <div id="video-container" class="video-container hide"></div>
          <div class="add-to-playlist-btn" id="add-to-playlist" title="Save to playlist">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </div>
        </div>
      </div>

      <div class="song-info">
        <div id="title" class="song-title">Lyra Player</div>
        <div id="artist" class="song-artist">Select a song to start</div>
      </div>
    </div>

    <div class="middle-section">
      <div class="controls">
        <!-- 12 DYNAMIC CUSTOM PRIORITY BUTTONS -->
        <button id="prev-btn" class="control-btn prev hide" title="Previous">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5"></line>
          </svg>
        </button>
        <button id="playPause-btn" class="control-btn play-pause hide" title="Play / Pause">
          <svg id="play" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 3 20 12 6 21"></polygon>
          </svg>
          <svg id="pause" class="hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>
        <button id="next-btn" class="control-btn next hide" title="Next">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>
        <button id="lyrics-toggle-btn" class="control-btn lyrics-btn hide" title="Toggle Lyrics">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </button>
        <button id="queue-toggle-btn" class="control-btn queue-btn hide" title="Toggle Queue">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
        <button id="playlist-toggle-btn" class="control-btn playlist-btn hide" title="Toggle Playlists">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15V6"></path>
            <path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path>
            <line x1="12" y1="12" x2="3" y2="12"></line>
            <line x1="16" y1="6" x2="3" y2="6"></line>
            <line x1="12" y1="18" x2="3" y2="18"></line>
          </svg>
        </button>
        <button id="repeat-btn" class="control-btn repeat-btn hide" title="Repeat">
          <svg class="repeat" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
          <svg class="repeatOnce hide" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            <text x="12" y="15" font-size="8.5" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">1</text>
          </svg>
        </button>

        <button id="shuffle-btn" class="control-btn shuffle hide" title="Shuffle">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>

        <button id="mute-btn" class="control-btn mute hide" title="Mute / Unmute">
          <svg class="unmuted" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="muted hide" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <button id="like-btn" class="control-btn like hide" title="Like">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
          </svg>
        </button>

        <button id="dislike-btn" class="control-btn dislike hide" title="Dislike">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path>
          </svg>
        </button>

        <button id="rewind-btn" class="control-btn rewind hide" title="Rewind 10s">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 2v6h6M2.66 15.57a10 10 0 1 0-.57-8.38l5.67-5.67"></path>
            <text x="12" y="15.5" font-size="8" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">10</text>
          </svg>
        </button>

        <button id="forward-btn" class="control-btn forward hide" title="Forward 10s">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1 .57-8.38l-5.67-5.67"></path>
            <text x="12" y="15.5" font-size="8" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">10</text>
          </svg>
        </button>

      </div>
    </div>

    <div id="lyrics-container" class="lyrics-container hide">
      <div id="lyrics-status" class="lyrics-status">Searching lyrics...</div>
      <div id="lyrics-list" class="lyrics-list"></div>
    </div>

    <div id="queue-container" class="queue-container hide">
      <div class="panel-header">
        <span class="panel-title">Queue</span>
        <span id="queue-count" class="panel-subtitle">0 tracks</span>
      </div>
      <div id="queue-status" class="panel-status hide">Loading queue...</div>
      <div id="queue-list" class="panel-list"></div>
    </div>

    <div id="playlist-container" class="playlist-container hide">
      <div class="panel-header">
        <span id="playlist-header-title" class="panel-title">Playlists</span>
        <button id="playlist-back-btn" class="panel-back-btn hide">← Back</button>
      </div>
      <div id="playlist-status" class="panel-status hide">Loading playlists...</div>
      <div id="playlist-list" class="panel-list"></div>
    </div>

    <div class="bottom-section">
      <div class="progress-container">
        <div id="track" class="progress-bar-fill"></div>
      </div>
    </div>
  </div>
</div>
