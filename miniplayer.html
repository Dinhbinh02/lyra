<div id="mini-player-root">
  <div id="ambient-bg" class="ambient-bg">
    <img id="bg-cover" class="bg-layer bg-base" src="" alt="bg" />
    <img class="bg-layer bg-center" src="" alt="bg" />
    <img class="bg-layer bg-left" src="" alt="bg" />
    <img class="bg-layer bg-right" src="" alt="bg" />
    <div class="ambient-overlay"></div>
  </div>

  <div class="player-container">
    <div class="top-section">
      <div class="cover-wrapper">
        <div class="cover">
          <img id="cover" src="" alt="cover" class="hide" />
          <div id="noCover" class="cover-placeholder"></div>
          <div id="video-container" class="video-container hide"></div>
          <div class="add-to-playlist-btn" id="add-to-playlist" title="Save to playlist">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </div>
        </div>
      </div>

      <div class="song-info">
        <div id="title" class="song-title">Lyra Player</div>
        <div id="artist" class="song-artist">Select a song to start</div>
      </div>
    </div>

    <div class="middle-section">
      <div class="controls">
        <button id="repeat-btn" class="control-btn repeat-btn" title="Repeat">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>
        <button class="control-btn prev" title="Previous">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5"></line>
          </svg>
        </button>
        <button id="playPause" class="control-btn play-pause" title="Play / Pause">
          <svg id="play" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 3 20 12 6 21"></polygon>
          </svg>
          <svg id="pause" class="hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>
        <button class="control-btn next" title="Next">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>
        <button id="lyrics-toggle-btn" class="control-btn lyrics-btn" title="Toggle Lyrics">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <div id="lyrics-container" class="lyrics-container hide">
      <div id="lyrics-status" class="lyrics-status">Searching lyrics...</div>
      <div id="lyrics-list" class="lyrics-list"></div>
    </div>

    <div class="bottom-section">
      <div class="progress-container">
        <div id="track" class="progress-bar-fill"></div>
      </div>
    </div>
  </div>
</div>
